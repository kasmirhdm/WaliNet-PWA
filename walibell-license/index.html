<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>WaliBell License Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="logo">🔔</div><div><h1>WaliBell</h1><p>License Manager</p></div></div>
    <button id="logout" class="ghost hidden">Keluar</button>
  </header>

  <section id="loginCard" class="card">
    <h2>Login Admin</h2>
    <p class="muted">Khusus pemilik / pengelola lisensi WaliBell.</p>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="Email admin">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="login" class="primary">Masuk</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="section-head"><div><h2>Buat Lisensi</h2><p class="muted">Kode dibuat otomatis dan berlaku untuk 1 perangkat.</p></div></div>
      <label>Nama Pembeli</label>
      <input id="buyerName" placeholder="Contoh: Budi Santoso">
      <label>WhatsApp</label>
      <input id="buyerPhone" inputmode="tel" placeholder="0812xxxxxxx">
      <label>Email <span class="muted">(opsional)</span></label>
      <input id="buyerEmail" type="email" placeholder="email pembeli">
      <label>Masa Berlaku</label>
      <select id="validity">
        <option value="0">Selamanya</option>
        <option value="30">30 hari</option>
        <option value="90">90 hari</option>
        <option value="365">1 tahun</option>
      </select>
      <button id="create" class="primary">BUAT LISENSI</button>
      <div id="created" class="license-result hidden">
        <small>LISENSI BERHASIL DIBUAT</small>
        <strong id="code"></strong>
        <div class="actions"><button id="copy" class="secondary">Salin Kode</button><button id="wa" class="secondary">Kirim WhatsApp</button></div>
      </div>
      <p id="createMsg" class="msg"></p>
    </div>

    <div class="card">
      <div class="section-head"><div><h2>Daftar Lisensi</h2><p class="muted">Pantau lisensi yang sudah dibuat.</p></div><button id="refresh" class="secondary">Refresh</button></div>
      <div id="licenses" class="list"><div class="muted">Belum ada data.</div></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
